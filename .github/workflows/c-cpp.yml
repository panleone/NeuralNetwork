name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
    - name: Compile
      run: make NeuralNetworkTests
    - name: Run Tests
      run: ./NeuralNetworkTests
